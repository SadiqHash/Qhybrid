[project]
name = "qhybrid"
version = "0.1.0"
description = "Quantum + Classical Hybrid Simulator (QHybrid) for running hybrid quantum algorithms with Qiskit, Cirq, and Python."
authors = [
    { name = "SadiqHash", email = "saddeequjp@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["quantum", "hybrid", "Qiskit", "Cirq", "VQE", "quantum-computing"]

[project.urls]
"Homepage" = "https://github.com/SadiqHash/Qhybrid"
"Repository" = "https://github.com/SadiqHash/Qhybrid"

[project.dependencies]
click = "^8.1.7"
rich = "^13.7.0"
pydantic = "^2.6.0"
loguru = "^0.7.2"
typing-extensions = "^4.10.0"
networkx = "^3.2.1"
pyyaml = "^6.0.1"

[project.optional-dependencies]
quantum = ["qiskit", "cirq"]
full = ["qiskit", "cirq", "numpy", "scipy", "matplotlib"]

[project.scripts]
qhybrid = "cli.main:main"

[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
